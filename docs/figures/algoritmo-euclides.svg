<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Algoritmo de Euclides para 252 y 198</title>
  <desc id="desc">Cuatro divisiones sucesivas terminan con residuo cero y señalan que el máximo común divisor es dieciocho.</desc>
  <rect width="900" height="500" fill="#f7fbff"/>
  <text x="450" y="52" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#123b6d">Algoritmo de Euclides</text>
  <g font-family="sans-serif" font-size="22" fill="#18344f">
    <rect x="70" y="95" width="760" height="68" rx="12" fill="#eaf2fb" stroke="#6f94b6" stroke-width="2"/>
    <text x="105" y="137">252 = 198 × 1 +</text><text x="330" y="137" font-weight="700" fill="#b05b1d">54</text><text x="690" y="137">par: (198, 54)</text>
    <rect x="70" y="177" width="760" height="68" rx="12" fill="#ffffff" stroke="#6f94b6" stroke-width="2"/>
    <text x="105" y="219">198 = 54 × 3 +</text><text x="313" y="219" font-weight="700" fill="#b05b1d">36</text><text x="690" y="219">par: (54, 36)</text>
    <rect x="70" y="259" width="760" height="68" rx="12" fill="#eaf2fb" stroke="#6f94b6" stroke-width="2"/>
    <text x="105" y="301">54 = 36 × 1 +</text><text x="295" y="301" font-weight="700" fill="#b05b1d">18</text><text x="690" y="301">par: (36, 18)</text>
    <rect x="70" y="341" width="760" height="68" rx="12" fill="#ffffff" stroke="#6f94b6" stroke-width="2"/>
    <text x="105" y="383">36 = 18 × 2 +</text><text x="295" y="383" font-weight="700" fill="#6b7280">0</text><text x="690" y="383">termina</text>
  </g>
  <rect x="260" y="431" width="380" height="48" rx="24" fill="#123b6d"/>
  <text x="450" y="463" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">MCD(252, 198) = 18</text>
</svg>
