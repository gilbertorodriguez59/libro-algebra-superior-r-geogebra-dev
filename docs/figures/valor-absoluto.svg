<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Valor absoluto como distancia</title>
  <desc id="desc">Una recta numérica muestra un intervalo centrado en a igual a dos y radio tres, desde menos uno hasta cinco.</desc>
  <rect width="900" height="430" fill="#f7fbff"/>
  <text x="450" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123b6d">|x - a| ≤ r es una condición de distancia</text>
  <line x1="90" y1="225" x2="820" y2="225" stroke="#18344f" stroke-width="4"/>
  <path d="M820 225 l-16 -9 v18 z" fill="#18344f"/>
  <line x1="270" y1="225" x2="630" y2="225" stroke="#2f7fbd" stroke-width="14" stroke-linecap="round"/>
  <g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#18344f">
    <line x1="150" y1="207" x2="150" y2="243" stroke="#18344f" stroke-width="3"/><text x="150" y="274">-3</text>
    <line x1="270" y1="197" x2="270" y2="253" stroke="#b58a2a" stroke-width="4"/><text x="270" y="285">a - r = -1</text>
    <line x1="450" y1="187" x2="450" y2="263" stroke="#123b6d" stroke-width="5"/><text x="450" y="300" font-weight="700">a = 2</text>
    <line x1="630" y1="197" x2="630" y2="253" stroke="#b58a2a" stroke-width="4"/><text x="630" y="285">a + r = 5</text>
    <line x1="750" y1="207" x2="750" y2="243" stroke="#18344f" stroke-width="3"/><text x="750" y="274">7</text>
  </g>
  <circle cx="270" cy="225" r="12" fill="#2f7fbd" stroke="#ffffff" stroke-width="3"/>
  <circle cx="630" cy="225" r="12" fill="#2f7fbd" stroke="#ffffff" stroke-width="3"/>
  <path d="M450 150 C390 115 330 115 270 150" fill="none" stroke="#b58a2a" stroke-width="4"/>
  <path d="M450 150 C510 115 570 115 630 150" fill="none" stroke="#b58a2a" stroke-width="4"/>
  <text x="360" y="116" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#745718">r = 3</text>
  <text x="540" y="116" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#745718">r = 3</text>
  <rect x="245" y="345" width="410" height="55" rx="27" fill="#123b6d"/>
  <text x="450" y="381" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#ffffff">|x - 2| ≤ 3  ⇔  -1 ≤ x ≤ 5</text>
</svg>
