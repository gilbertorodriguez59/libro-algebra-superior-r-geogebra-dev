project:
  type: book
  output-dir: docs
  resources:
    - figures/**
    - interactivos/**
    - notebooks/**

book:
  title: "Álgebra Superior con aplicaciones en R y GeoGebra"
  subtitle: "Teoría, visualización y experimentación"
  author: "Jesús Gilberto Rodríguez Escobedo"
  date: "2026-08-07"
  chapters:
    - index.qmd
    - 01-logica-conjuntos.qmd
    - 02-enteros-reales.qmd
    - indices.qmd
    - references.qmd
  page-footer:
    center: "Licencia CC BY-NC-SA 4.0"
  downloads: [pdf]
  repo-url: https://github.com/gilbertorodriguez59/libro-algebra-superior-r-geogebra-dev

bibliography: references.bib
lang: es
number-depth: 2
toc-depth: 2

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    code-fold: false
    anchor-sections: true
    search: true
  pdf:
    documentclass: scrreprt
    toc: true
    colorlinks: true
    keep-tex: false
    fig-pos: H
    lof: true
    lot: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
