project:
  type: book
  output-dir: docs
  resources:
    - figures/**
    - interactivos/**
    - notebooks/**
    - html/**

book:
  title: "Álgebra Superior con aplicaciones en R y GeoGebra"
  subtitle: "Teoría, visualización y experimentación"
  author: "Jesús Gilberto Rodríguez Escobedo"
  date: "2026-08-07"
  output-file: "Algebra-Superior-R-GeoGebra-Capitulos-1-2"
  chapters:
    - index.qmd
    - 01-logica-conjuntos.qmd
    - 02-enteros-reales.qmd
    - indices.qmd
    - references.qmd
  page-footer:
    center: "Licencia CC BY-NC-SA 4.0"
  page-navigation: true
  sidebar:
    title: "Contenido del libro"
    style: docked
    collapse-level: 1
  downloads: [pdf]
  repo-url: https://github.com/gilbertorodriguez59/libro-algebra-superior-r-geogebra-dev

bibliography: references.bib
lang: es
number-depth: 2
toc-depth: 2

format:
  html:
    theme: cosmo
    css: styles.css
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"
    toc: true
    toc-title: "En este capítulo"
    code-copy: true
    code-fold: false
    anchor-sections: true
    search: true
    include-after-body: html/sidebar.html
  pdf:
    documentclass: scrreprt
    toc: true
    colorlinks: true
    keep-tex: false
    fig-pos: H
    lof: true
    lot: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
