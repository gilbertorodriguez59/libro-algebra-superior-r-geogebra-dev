<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clasificador de funciones finitas</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7fbff;--panel:#fff;--text:#173f6b;--muted:#4d6680;--line:#7698b7;--edge:#2e6f9f;--bad:#b33b3b;--ok:#28714d}
    @media(prefers-color-scheme:dark){:root{--bg:#14202b;--panel:#1c2b38;--text:#e8f3fb;--muted:#b7c9d7;--line:#8eb0ca;--edge:#73b9e7;--bad:#ff8e8e;--ok:#74d6a3}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.lab{max-width:980px;margin:auto;padding:18px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{min-width:140px;flex:1}.field label{display:block;font-weight:650;margin-bottom:5px}.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font:inherit}.check{display:flex;gap:8px;align-items:center;min-height:43px}.view{display:grid;grid-template-columns:minmax(380px,1.25fr) minmax(260px,.75fr);gap:18px;align-items:center;margin-top:16px}.diagram{width:100%;height:auto}.oval{fill:var(--panel);stroke:var(--line);stroke-width:3}.node{fill:var(--bg);stroke:var(--text);stroke-width:2}.edge{fill:none;stroke:var(--edge);stroke-width:3}.extra{stroke:var(--bad)}.svgtext{font:18px system-ui;fill:var(--text)}.svgtitle{font:700 22px system-ui;fill:var(--text)}.feedback{background:var(--panel);border-left:5px solid var(--edge);border-radius:10px;padding:16px}.feedback strong{font-size:1.13rem}.flags{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.flag{padding:7px 8px;border-bottom:1px solid var(--line)}.yes{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}.reason{color:var(--muted)}@media(max-width:760px){.view{grid-template-columns:1fr}.lab{padding:13px}}
  </style>
</head>
<body>
<main class="lab">
  <div class="controls">
    <div class="field"><label for="m1">f(1)</label><select id="m1"><option value="a">a</option><option value="b">b</option><option value="c">c</option><option value="none">Sin imagen</option></select></div>
    <div class="field"><label for="m2">f(2)</label><select id="m2"><option value="a">a</option><option value="b" selected>b</option><option value="c">c</option><option value="none">Sin imagen</option></select></div>
    <div class="field"><label for="m3">f(3)</label><select id="m3"><option value="a">a</option><option value="b">b</option><option value="c" selected>c</option><option value="none">Sin imagen</option></select></div>
    <label class="check"><input id="extra" type="checkbox"> Añadir 1 → b</label>
  </div>
  <div class="view">
    <svg id="diagram" class="diagram" viewBox="0 0 620 430" role="img" aria-labelledby="funTitle funDesc"><title id="funTitle">Diagrama sagital editable</title><desc id="funDesc">Las flechas se actualizan con las imágenes elegidas para 1, 2 y 3.</desc>
      <defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="currentColor"/></marker></defs>
      <text class="svgtitle" x="155" y="42" text-anchor="middle">Dominio A</text><text class="svgtitle" x="465" y="42" text-anchor="middle">Codominio B</text>
      <ellipse class="oval" cx="155" cy="230" rx="95" ry="165"/><ellipse class="oval" cx="465" cy="230" rx="95" ry="165"/>
      <g id="arrows"></g>
      <g class="svgtext" text-anchor="middle"><circle class="node" cx="155" cy="135" r="23"/><text x="155" y="142">1</text><circle class="node" cx="155" cy="230" r="23"/><text x="155" y="237">2</text><circle class="node" cx="155" cy="325" r="23"/><text x="155" y="332">3</text><circle class="node" cx="465" cy="135" r="23"/><text x="465" y="142">a</text><circle class="node" cx="465" cy="230" r="23"/><text x="465" y="237">b</text><circle class="node" cx="465" cy="325" r="23"/><text x="465" y="332">c</text></g>
    </svg>
    <section class="feedback" aria-live="polite"><strong id="summary"></strong><div class="flags"><div class="flag">Función: <span id="isFunction"></span></div><div class="flag">Inyectiva: <span id="injective"></span></div><div class="flag">Suprayectiva: <span id="surjective"></span></div><div class="flag">Biyectiva: <span id="bijective"></span></div></div><div class="reason" id="reason"></div></section>
  </div>
</main>
<script>
(() => {
  const root = document.querySelector('.lab');
  const selects = [root.querySelector('#m1'),root.querySelector('#m2'),root.querySelector('#m3')];
  const extra = root.querySelector('#extra');
  const arrows = root.querySelector('#arrows');
  const ys = {a:135,b:230,c:325};
  const status = (id, value) => {const el=root.querySelector(id);el.textContent=value?'Sí':'No';el.className=value?'yes':'no';};
  const arrow = (fromY,toY,isExtra=false) => {
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M180 ${fromY} C270 ${fromY}, 350 ${toY}, 438 ${toY}`);
    p.setAttribute('class',isExtra?'edge extra':'edge');p.setAttribute('marker-end','url(#arrow)');return p;
  };
  const update = () => {
    const values=selects.map(s=>s.value);arrows.replaceChildren();
    values.forEach((v,i)=>{if(v!=='none')arrows.appendChild(arrow([135,230,325][i],ys[v]));});
    if(extra.checked)arrows.appendChild(arrow(135,230,true));
    const missing=values.map((v,i)=>v==='none'?i+1:null).filter(Boolean);
    const isFunction=missing.length===0&&!extra.checked;
    const used=new Set(values.filter(v=>v!=='none'));
    const injective=isFunction&&used.size===values.length;
    const surjective=isFunction&&['a','b','c'].every(v=>used.has(v));
    const bijective=injective&&surjective;
    status('#isFunction',isFunction);status('#injective',injective);status('#surjective',surjective);status('#bijective',bijective);
    let summary='';let reason='';
    if(!isFunction){summary='La correspondencia no es función.';reason=extra.checked?'El elemento 1 tiene dos imágenes.':'Queda sin imagen: '+missing.join(', ')+'.';}
    else if(bijective){summary='La función es biyectiva.';reason='No repite imágenes y cubre todo el codominio; por ello tiene función inversa.';}
    else if(injective){summary='La función es inyectiva.';reason='No repite imágenes, pero algún elemento del codominio queda sin recibir flecha.';}
    else if(surjective){summary='La función es suprayectiva.';reason='Todo el codominio recibe al menos una flecha, pero se repite una imagen.';}
    else{summary='Es función, pero no inyectiva ni suprayectiva.';reason='Repite al menos una imagen y deja libre al menos un elemento del codominio.';}
    root.querySelector('#summary').textContent=summary;root.querySelector('#reason').textContent=reason;
  };
  selects.forEach(s=>s.addEventListener('change',update));extra.addEventListener('change',update);update();
})();
</script>
</body>
</html>
