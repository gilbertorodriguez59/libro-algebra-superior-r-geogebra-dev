<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio de tablas de verdad</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7fbff;--panel:#fff;--text:#173f6b;--muted:#4d6680;--line:#8eabc3;--accent:#2f7fbd;--on:#2b8557;--off:#a53c3c}
    @media(prefers-color-scheme:dark){:root{--bg:#14202b;--panel:#1c2b38;--text:#e8f3fb;--muted:#b7c9d7;--line:#8eb0ca;--accent:#64b5ed;--on:#70d69e;--off:#ff9292}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.lab{max-width:1000px;margin:auto;padding:18px}.controls{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.field{min-width:250px;flex:1}.field label{display:block;font-weight:650;margin-bottom:5px}.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font:inherit}.switches{display:flex;gap:16px;flex-wrap:wrap;padding:9px 0}.switches label{font-weight:650}.view{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(400px,1.2fr);gap:18px;margin-top:15px}.signal{background:var(--panel);border-left:5px solid var(--accent);border-radius:10px;padding:20px}.equation{font-size:1.25rem;font-weight:700}.lamp{width:104px;height:104px;border-radius:50%;border:5px solid var(--line);display:grid;place-items:center;margin:20px auto 10px;font-size:2rem;font-weight:700}.lamp.on{background:color-mix(in srgb,var(--on) 60%,transparent);color:var(--text)}.lamp.off{background:color-mix(in srgb,var(--off) 28%,transparent);color:var(--text)}.state{text-align:center;font-weight:700}.classification{text-align:center;color:var(--muted);margin-top:12px}.table-wrap{overflow-x:auto}.truth{width:100%;border-collapse:collapse;background:var(--panel)}.truth th,.truth td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}.truth th{color:var(--text)}.truth tr.current{outline:3px solid var(--accent);outline-offset:-3px}.v{color:var(--on);font-weight:700}.f{color:var(--off);font-weight:700}@media(max-width:760px){.view{grid-template-columns:1fr}.lab{padding:13px}}
  </style>
</head>
<body>
<main class="lab">
  <div class="controls"><div class="field"><label for="expr">Expresión</label><select id="expr"><option value="and">p ∧ q</option><option value="or">p ∨ q</option><option value="imp">p ⇒ q</option><option value="iff">p ⇔ q</option><option value="alarm">p ∧ (q ∨ r)</option><option value="custom">(p ∨ q) ∧ ¬r</option></select></div><div class="switches"><label><input id="p" type="checkbox"> p</label><label><input id="q" type="checkbox"> q</label><label><input id="r" type="checkbox"> r</label></div></div>
  <div class="view"><section class="signal" aria-live="polite"><div class="equation" id="formula"></div><div class="lamp off" id="lamp">0</div><div class="state" id="state"></div><div class="classification" id="classification"></div></section><div class="table-wrap"><table class="truth"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></div>
</main>
<script>
(() => {
  const root=document.querySelector('.lab');const expr=root.querySelector('#expr');const inputs={p:root.querySelector('#p'),q:root.querySelector('#q'),r:root.querySelector('#r')};
  const defs={and:{label:'p ∧ q',n:2,fn:(p,q)=>p&&q},or:{label:'p ∨ q',n:2,fn:(p,q)=>p||q},imp:{label:'p ⇒ q',n:2,fn:(p,q)=>!p||q},iff:{label:'p ⇔ q',n:2,fn:(p,q)=>p===q},alarm:{label:'p ∧ (q ∨ r)',n:3,fn:(p,q,r)=>p&&(q||r)},custom:{label:'(p ∨ q) ∧ ¬r',n:3,fn:(p,q,r)=>(p||q)&&!r}};
  const vf=v=>v?'V':'F';
  const update=()=>{const d=defs[expr.value];inputs.r.closest('label').style.display=d.n===3?'':'none';const current=[inputs.p.checked,inputs.q.checked,inputs.r.checked];const rows=[];const total=2**d.n;for(let i=0;i<total;i++){const vals=[];for(let j=0;j<d.n;j++)vals.push(Boolean((i>>(d.n-1-j))&1));rows.push({vals,out:d.fn(...vals)});}const out=d.fn(...current.slice(0,d.n));root.querySelector('#formula').textContent=d.label;const lamp=root.querySelector('#lamp');lamp.textContent=out?'1':'0';lamp.className='lamp '+(out?'on':'off');root.querySelector('#state').textContent=out?'Salida verdadera / nivel alto':'Salida falsa / nivel bajo';const all=rows.every(x=>x.out),none=rows.every(x=>!x.out);root.querySelector('#classification').textContent=all?'Tautología':none?'Contradicción':'Contingencia';root.querySelector('#head').innerHTML=['p','q',...(d.n===3?['r']:[]),d.label].map(x=>`<th scope="col">${x}</th>`).join('');const tbody=root.querySelector('#body');tbody.replaceChildren();rows.forEach(row=>{const tr=document.createElement('tr');if(row.vals.every((v,i)=>v===current[i]))tr.className='current';[...row.vals,row.out].forEach(v=>{const td=document.createElement('td');td.textContent=vf(v);td.className=v?'v':'f';tr.appendChild(td);});tbody.appendChild(tr);});};
  expr.addEventListener('change',update);Object.values(inputs).forEach(x=>x.addEventListener('change',update));update();
})();
</script>
</body>
</html>
